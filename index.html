<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Surprise 🎁</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#5b1b68,#190b2c 55%,#080512)}
.card{width:90%;max-width:620px;padding:42px 25px;text-align:center;border-radius:30px;background:#ffffff12;border:1px solid #ffffff30;box-shadow:0 0 50px #ff50b84d}
.emoji{font-size:75px;animation:bounce 1.5s infinite}h1{font-size:45px;margin:15px 0;text-shadow:0 0 25px #ff69b4}h2{font-size:28px;margin:0 0 15px}p{line-height:1.7;color:#f8dff0}
button{margin-top:25px;padding:15px 32px;border:0;border-radius:30px;background:#fff;color:#7b287d;font-size:17px;font-weight:bold;cursor:pointer;transition:.3s}button:hover{transform:scale(1.1);box-shadow:0 0 30px #ff69b4}
@keyframes bounce{50%{transform:translateY(-12px)}}
</style></head>
<body><div class="card"><div class="emoji">🎂</div><h1>It's Your Day! ✨</h1><h2>Happy Birthday Cuto Paglu 😂❤️</h2><p>Aaj ka din thoda zyada special hai... kyun ke aaj birthday hai ek bohat hi khaas Paglu ka. 🥹✨</p>
<button onclick="location.href='surprise.html'">🎁 Open Your Surprise</button></div></body></html>
